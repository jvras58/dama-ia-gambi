[project]
name = "dama"
version = "0.1.0"
description = "Damas ao vivo pela câmera do telefone, com LLMs via Gambi e Minimax."
readme = "README.md"
authors = [
    { name = "jvras58", email = "jvras58@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.4",
    "httpx2>=2.16.0",
    "mediapipe>=1.2.2",
    "numpy>=2.5.4",
    "openai>=3.49.0",
    "opencv-python-headless>=5.0.0.93",
    "pydantic-settings>=2.16.2",
    "qrcode>=8.2",
    "typer>=0.29.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dama = "dama.cli:app"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# O projeto nao usa __init__.py: `dama` e um pacote de namespace.
namespace = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "TID", "D1"]

[tool.ruff.lint.flake8-tidy-imports]
# Imports sempre completos: `from dama.regras.tipos import ...`, nunca `from .tipos`.
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["dama", "apoio"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["src", "tests"]
namespace_packages = true
explicit_package_bases = true
files = ["src"]
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "types-qrcode>=8.2.0.20260518",
]

[[tool.mypy.overrides]]
module = ["mediapipe", "mediapipe.*"]
ignore_missing_imports = true
