[project]
name = "dama"
version = "0.1.0"
description = "Damas ao vivo pela câmera do telefone, com LLMs via Gambi e Minimax."
readme = "README.md"
authors = [
    { name = "jvras58", email = "jvras58@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.4",
    "mediapipe>=1.2.2",
    "numpy>=2.5.4",
    "openai>=3.49.0",
    "opencv-python-headless>=5.0.0.93",
    "pydantic-settings>=2.16.2",
    "qrcode>=8.2",
    "typer>=0.29.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dama = "dama.cli:app"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
